<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Personal academic homepage." />
    <title>Your Name</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/css/mdb.min.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/academicons@1.9.1/css/academicons.min.css"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%231d4e89'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='13' fill='white'>DD</text></svg>" />
  </head>

  <body class="fixed-top-nav">
    <header>
      <nav id="navbar" class="navbar navbar-light navbar-expand-sm fixed-top">
        <div class="container">
          <a class="navbar-brand title font-weight-lighter" href="#about">
            <span class="font-weight-bold" data-content="brandStrong">Your Name</span><span data-content="brandLight"></span>
          </a>

          <button
            class="navbar-toggler collapsed ml-auto"
            type="button"
            data-toggle="collapse"
            data-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar top-bar"></span>
            <span class="icon-bar middle-bar"></span>
            <span class="icon-bar bottom-bar"></span>
          </button>

          <div class="collapse navbar-collapse text-right" id="navbarNav">
            <ul class="navbar-nav ml-auto flex-nowrap">
              <li class="nav-item" id="nav-about">
                <a class="nav-link section-link" href="#about">about</a>
              </li>
              <li class="nav-item" id="nav-publications">
                <a class="nav-link section-link" href="#publications">publications</a>
              </li>
              <li class="nav-item" id="nav-education">
                <a class="nav-link section-link" href="#education">education</a>
              </li>
              <li class="nav-item" id="nav-experience">
                <a class="nav-link section-link" href="#experience">experience</a>
              </li>
              <!-- Awards hidden for now
              <li class="nav-item" id="nav-awards">
                <a class="nav-link section-link" href="#awards">awards</a>
              </li>
              -->
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <div class="container mt-5">
      <div class="post">

        <article>
          <section id="about" class="page-section">
            <div class="profile float-right">
              <figure>
                <picture>
                  <img
                    id="portrait"
                    src="https://avatars.githubusercontent.com/u/89365454?v=4"
                    class="img-fluid z-depth-1 rounded"
                    alt="Portrait"
                  />
                </picture>
              </figure>
              <div class="address" id="portrait-address"></div>
              <div class="contact-block">
                <p class="contact-label">Contact me</p>
                <div id="contact-emails"></div>
              </div>
              <a id="cv-download-link" class="cv-download-link" href="assets/CV.pdf" download>Download CV</a>
            </div>

            <div class="clearfix">
              <div id="intro"></div>

              <div id="focus-intro"></div>
              <div id="focus-areas-section">
                <div id="focus-areas-intro"></div>
                <ul id="focus-list"></ul>
                <div id="focus-areas-outro"></div>
              </div>
            </div>
          </section>

          <section id="publications" class="page-section">
            <h2 class="section-heading">publications</h2>
            <div id="publications-list"></div>
          </section>

          <section id="education" class="page-section">
            <h2 class="section-heading">education</h2>
            <div id="education-list"></div>
          </section>

          <section id="experience" class="page-section">
            <h2 class="section-heading">experience</h2>
            <div id="experience-list"></div>
          </section>

          <!-- Awards hidden for now
          <section id="awards" class="page-section">
            <h2 class="section-heading">awards</h2>
            <div id="awards-list"></div>
          </section>
          -->
        </article>
      </div>
    </div>

    <footer class="fixed-bottom">
      <div class="container mt-0">
        &copy; Copyright <span id="footer-year"></span>
        <span id="footer-name">Your Name</span>. Powered by
        <a href="https://pages.github.com/" target="_blank" rel="noreferrer">GitHub Pages</a>.
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" crossorigin="anonymous"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" crossorigin="anonymous"></script>
    <script src="content.js"></script>
    <script src="script.js"></script>
  </body>
</html>
